<app-button-create-user  (createUser)="createUser($event)"></app-button-create-user>
<div class="list"> 
  <div *ngFor="let user of usersService.users$ | async" class="list-cards">
    <app-user-card [user]="user" (deleteUser)="deleteUser($event)"
    (editUser)="editUser($event)"></app-user-card>
  </div>
</div>
